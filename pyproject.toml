[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-privacy-blur"
version = "0.1.0"
description = "Local video anonymization baseline for faces and license plates"
requires-python = ">=3.11"
dependencies = [
  "opencv-python>=4.10,<5",
  "streamlit>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
